name: Firmware Tool

# Checks every PR and master push under the firmware tool path; deploys from master
on:
  push:
    branches:
      - master
    paths:
      - firmware_tool/**
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/firmware-tool.yml
      - .github/actions/publish-pages/**
      - scripts/publish_pages.py
  pull_request:
    branches:
      - master
    paths:
      - firmware_tool/**
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/firmware-tool.yml
      - .github/actions/publish-pages/**
      - scripts/publish_pages.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack enable && pnpm i --frozen-lockfile

      - name: Check formatting
        run: pnpm firmware-tool:format:check

      - name: Lint
        run: pnpm firmware-tool:lint

      - name: Type check
        run: pnpm firmware-tool:typecheck

      - name: Type-check tests
        run: pnpm --filter @pubmote/firmware-tool test:typecheck

      - name: Test
        run: pnpm --filter @pubmote/firmware-tool test

      - name: Build
        working-directory: ./firmware_tool
        run: pnpm build

      - name: Upload firmware tool site
        if: github.event_name == 'push' && github.repository == 'techfoundrynz/Pubmote'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-tool-site
          path: firmware_tool/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.repository == 'techfoundrynz/Pubmote'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.url }}
    concurrency:
      group: pubmote-pages
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Check this is still the current production revision
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const head = await github.rest.repos.getCommit({...context.repo, ref: 'master'});
            core.setOutput('deploy', head.data.sha === context.sha);
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: firmware-tool-site
          path: .pio/firmware-tool-site
      - name: Publish site while preserving simulator previews
        id: pages
        if: steps.current.outputs.deploy == 'true'
        uses: ./.github/actions/publish-pages
        with:
          source: .pio/firmware-tool-site
