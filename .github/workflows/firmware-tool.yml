name: Firmware Tool

# Checks every PR and master push under the firmware tool path; deploys from master
on:
  push:
    branches:
      - master
    paths:
      - firmware_tool/**
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/firmware-tool.yml
  pull_request:
    branches:
      - master
    paths:
      - firmware_tool/**
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/firmware-tool.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack enable && pnpm i --frozen-lockfile

      - name: Check formatting
        run: pnpm firmware-tool:format:check

      - name: Lint
        run: pnpm firmware-tool:lint

      - name: Type check
        run: pnpm firmware-tool:typecheck

      - name: Build
        working-directory: ./firmware_tool
        run: pnpm build

      - name: GH Pages deploy
        if: github.event_name == 'push' && github.repository == 'techfoundrynz/Pubmote'
        uses: Cecilapp/GitHub-Pages-deploy@3.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: contactsimonwilson@gmail.com
          # Where static files are.
          build_dir: ./firmware_tool/dist
          # Which branch to push files.
          cname: pubmote.com
