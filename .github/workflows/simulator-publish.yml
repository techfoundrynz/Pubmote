name: Publish simulator previews

on:
  workflow_run:
    workflows: ['Simulator previews', 'Publish Release']
    types: [completed]
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'techfoundrynz/Pubmote' && (github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.url }}
    # Shared with the firmware tool deploy. Keep all queued release deployments.
    concurrency:
      group: pubmote-pages
      cancel-in-progress: false
      queue: max
    steps:
      # Only trusted default-branch publication code is executed with write access.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Locate payload from the completed build
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./.github/scripts/simulator_publish.cjs');
            await publish.locate({github, context, core});
      - name: Download static payload
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: simulator-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .pio/incoming-preview
      - name: Verify revision and determine destination
        id: validated
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./.github/scripts/simulator_publish.cjs');
            await publish.validate({github, context, core});
      - name: Publish or remove preview
        id: pages
        if: steps.validated.outputs.publish == 'true'
        uses: ./.github/actions/publish-pages
        with:
          source: ${{ steps.validated.outputs.source }}
          destination: ${{ steps.validated.outputs.destination }}
          remove: ${{ steps.validated.outputs.remove }}
          immutable: ${{ steps.validated.outputs.immutable }}
      - name: Report hosted links on the PR or release
        if: steps.validated.outputs.publish == 'true' && steps.validated.outputs.remove != 'true'
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
          PREVIEW_DESTINATION: ${{ steps.validated.outputs.destination }}
        with:
          script: |
            const publish = require('./.github/scripts/simulator_publish.cjs');
            await publish.report({github, context, core});
