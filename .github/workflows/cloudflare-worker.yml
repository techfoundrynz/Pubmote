name: Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/cloudflare-worker.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/cloudflare-worker.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Check API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack enable && pnpm i --frozen-lockfile

      - name: Check API
        run: |
          pnpm --filter @pubmote/api typecheck
          pnpm --filter @pubmote/api lint
          pnpm --filter @pubmote/api format:check
          pnpm --filter @pubmote/api test

      - name: Build Worker
        run: pnpm --filter @pubmote/api exec wrangler deploy --dry-run

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.repository == 'techfoundrynz/Pubmote' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack enable && pnpm i --frozen-lockfile

      - name: Set Worker GitHub secret
        working-directory: api
        shell: bash
        run: |
          if [ -z "$RELEASES_AUTH_TOKEN" ]; then
            echo "::error::The RELEASES_AUTH_TOKEN repository secret is required for OTA discovery."
            exit 1
          fi
          printf '%s' "$RELEASES_AUTH_TOKEN" | pnpm exec wrangler secret put RELEASES_AUTH_TOKEN
        env:
          RELEASES_AUTH_TOKEN: ${{ secrets.RELEASES_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm api:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
