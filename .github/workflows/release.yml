name: Publish Release

# Runs on a master push that touches platformio.ini, or manually
on:
  push:
    branches:
      - master
    paths:
      - platformio.ini
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run without version check'
        required: false
        default: false
        type: boolean
      custom_version:
        description: 'Custom version tag (e.g., v1.2.3) - leave empty to use version from platformio.ini'
        required: false
        default: ''
        type: string
        
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
        
# Required to create a GitHub release and tag
permissions:
  contents: write
        
jobs:
  # Ensure a version update has happened
  # Extract a version tag for the deployment
  check_version_update:
    runs-on: ubuntu-latest

    outputs:
      should_continue: ${{ steps.check_changes.outputs.should_continue }}
      version_tag: ${{ steps.extract_version.outputs.version_tag }}
              
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify Changed Version
        id: check_changes
        run: |
          # If manually triggered with force_run, skip version checks
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_run }}" == "true" ]]; then
            echo "Manual run with force_run enabled. Skipping version checks."
            echo "should_continue=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If manually triggered without force_run, still check for version changes
          FILE="platformio.ini"

          # Compare against the push's parent, not the file's history - only 2
          # commits are fetched, so a history walk can return HEAD itself
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "No parent commit available for comparison."
            echo "should_continue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Comparing commits: $(git rev-parse HEAD^) -> HEAD"

          # Compare the version value itself, so unrelated edits to this file do not
          # trigger a release and a reformat of the line does not look like a bump
          extract() { grep '^custom_firmware_version' | awk -F'=' '{print $2}' | tr -d '[:space:]'; }
          OLD_VERSION=$(git show HEAD^:"$FILE" 2>/dev/null | extract)
          NEW_VERSION=$(extract < "$FILE")

          CHANGED=false
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Version changed: '$OLD_VERSION' -> '$NEW_VERSION'"
            CHANGED=true
          fi

          if $CHANGED; then
            echo "should_continue=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant line changes detected. Exiting workflow."
            echo "should_continue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Extract Version
        id: extract_version
        run: |
          # Use custom version if provided, otherwise extract from file
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.custom_version }}" ]]; then
            VERSION_TAG="${{ github.event.inputs.custom_version }}"
            echo "Using custom version: $VERSION_TAG"
          else
            VERSION=$(grep '^custom_firmware_version' platformio.ini | awk -F'=' '{print $2}' | tr -d '[:space:]')
            VERSION_TAG="v${VERSION}"
            echo "Extracted Version from file: $VERSION_TAG"
          fi

          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

  build_and_release:
    needs: check_version_update
    if: needs.check_version_update.outputs.should_continue == 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install PlatformIO Core
      run: pip install --upgrade platformio

    - name: Build PlatformIO Project
      run: |
          sed -i 's/build_type = debug/build_type = release/g' platformio.ini
          pio run
      env:
          PLATFORMIO_BUILD_FLAGS: |
            -D RELEASE_VARIANT=\"release\"
            -D RELEASES_AUTH_TOKEN=\"${{ secrets.RELEASES_AUTH_TOKEN }}\"

    - name: Create Git Tag
      run: |
        VERSION_TAG="${{ needs.check_version_update.outputs.version_tag }}"
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git tag "$VERSION_TAG"
        git push origin "$VERSION_TAG"

    - name: Attach Files and Publish
      uses: softprops/action-gh-release@v2
      with: 
        tag_name: ${{ needs.check_version_update.outputs.version_tag }}
        files: |
          *.zip
          *.bin
          *.elf
        prerelease: true
        fail_on_unmatched_files: true
        generate_release_notes: true
        