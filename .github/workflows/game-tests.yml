name: Game tests

on:
  pull_request:
    paths:
      - 'games/**'
      - 'scripts/play_game.py'
      - 'scripts/install_game.py'
      - 'tests/test_game*.py'
      - 'tests/requirements-games.txt'
      - 'firmware/src/games/**'
      - 'firmware/src/screens/game_screen.*'
      - 'firmware/src/slint/ui/game.slint'
      - '.github/workflows/game-tests.yml'
  push:
    branches: [master]
    paths:
      - 'games/**'
      - 'scripts/*game*.py'
      - 'tests/test_game*.py'
      - 'tests/requirements-games.txt'
      - '.github/workflows/game-tests.yml'

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements-games.txt
      - run: python -m unittest discover -s tests -p 'test_game*.py'
