<svg xmlns="http://www.w3.org/2000/svg" width="61" height="98" viewBox="0 0 61 98">
<defs>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#9a6536"/><stop offset="0.6" stop-color="#7a4a24"/><stop offset="1" stop-color="#4f2e14"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4ad"/><stop offset="1" stop-color="#e6ecf0"/></linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c888"/><stop offset="0.55" stop-color="#d9a05b"/><stop offset="1" stop-color="#b3773a"/></linearGradient>
</defs>
<!-- uprights and their grooves -->
<rect x="4" y="5" width="8" height="83" fill="url(#wood)"/>
<rect x="49" y="5" width="8" height="83" fill="url(#wood)"/>
<rect x="10.5" y="5" width="1.5" height="83" fill="#2e1a0b"/>
<rect x="49" y="5" width="1.5" height="83" fill="#2e1a0b"/>
<!-- crossbar -->
<rect x="0" y="0" width="61" height="6.5" rx="1.5" fill="#6b3f1c"/>
<rect x="0" y="0" width="61" height="2" rx="1" fill="#9a6536"/>
<!-- weight and angled blade -->
<rect x="16" y="6.5" width="29" height="4.5" fill="#3a3a44"/>
<path d="M12 11 H49 V17 L12 27 Z" fill="url(#blade)"/>
<path d="M12 27 L49 17 L49 18.6 L12 28.6 Z" fill="#ffffff"/>
<rect x="14" y="12" width="33" height="1" fill="#ffffff" opacity="0.5"/>
<!-- rope to a cleat -->
<path d="M45 8 C52 8 57 10 57.5 16 L57.5 50" fill="none" stroke="#c9b27a" stroke-width="1"/>
<rect x="55" y="49.5" width="5" height="2" fill="#3a3a44"/>
<!-- the condemned: body behind the stocks -->
<rect x="24" y="60.5" width="37" height="7" rx="3.5" fill="url(#crust)"/>
<g fill="#f6dcaa"><rect x="36" y="62.3" width="4.5" height="1.8" rx="0.9"/><rect x="44" y="62.3" width="4.5" height="1.8" rx="0.9"/><rect x="52" y="62.3" width="4.5" height="1.8" rx="0.9"/></g>
<!-- stocks with the lunette -->
<path d="M11 57 H50 V61 H35 A3.5 3.5 0 0 0 28 61 H11 Z" fill="#4f2e14"/>
<path d="M11 71 H50 V67 H35 A3.5 3.5 0 0 1 28 67 H11 Z" fill="#4f2e14"/>
<!-- head poking through, worried, in a beret -->
<rect x="10" y="60.5" width="20" height="7" rx="3.5" fill="url(#crust)"/>
<circle cx="15" cy="63" r="1.6" fill="#ffffff"/><circle cx="14.6" cy="63.3" r="0.8" fill="#1b1208"/>
<path d="M13 66 Q15 65 17 66" fill="none" stroke="#6a3d18" stroke-width="0.7"/>
<ellipse cx="13" cy="59.6" rx="5.2" ry="2" fill="#1b1b2e"/>
<rect x="12.5" y="56.8" width="1.2" height="1.6" fill="#1b1b2e"/>
<!-- wicker basket -->
<path d="M5 75 H27 L25 87 H7 Z" fill="#a07840"/>
<rect x="4" y="74" width="24" height="2.2" rx="1.1" fill="#c09458"/>
<g stroke="#6f5028" stroke-width="0.6"><path d="M6 79 H26"/><path d="M6.6 82.5 H25.4"/></g>
<g stroke="#8a6634" stroke-width="0.6"><path d="M9 76 V87"/><path d="M13 76 V87"/><path d="M17 76 V87"/><path d="M21 76 V87"/></g>
<!-- platform and step -->
<rect x="0" y="87" width="61" height="6" fill="#6b3f1c"/>
<rect x="0" y="87" width="61" height="1.6" fill="#9a6536"/>
<rect x="4" y="93" width="53" height="5" fill="#4f2e14"/>
</svg>
