<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PubRemote simulator</title>
<link rel="stylesheet" href="style.css">
<body>
<header><div><strong>PubRemote simulator</strong><p id="revision">Real device UI · simulated hardware</p></div>
<nav><label>Panel <select id="panel"><option value="466,466,0">Round 466</option><option value="240,240,0">Round 240</option><option value="410,502,1">Rectangular 410 × 502</option></select></label><a id="report-link" href="report/" hidden>Visual report</a></nav></header>
<p id="status" role="status">Loading simulator…</p>
<main><section aria-label="Remote UI"><canvas id="remote" tabindex="0" aria-label="PubRemote touchscreen"></canvas></section>
<section aria-label="Simulated hardware"><canvas id="controls" tabindex="0" aria-label="Telemetry and hardware controls"></canvas></section></main>
<footer>Click and drag to use the touchscreen. Tab moves focus; Enter activates. Settings last for this session.</footer>
<script type="module" src="app.js"></script>
</body></html>
